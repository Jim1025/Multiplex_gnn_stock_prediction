<svg viewBox="0 0 740 638" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman','Nimbus Roman',Georgia,serif">
  <rect width="740" height="638" fill="#ffffff"/>
  <line x1="20" y1="18" x2="720" y2="18" stroke="#000" stroke-width="2"/>
  <text x="24" y="44" font-size="17" font-weight="bold">Algorithm 3</text>
  <text x="140" y="44" font-size="17">Phase 3 — Cross-sectional return scoring</text>
  <line x1="20" y1="56" x2="720" y2="56" stroke="#000" stroke-width="1"/>
  <text x="24" y="84" font-size="15" font-weight="bold">Input:</text>
  <text x="98" y="84" font-size="15" font-style="italic">Training days D<tspan baseline-shift="sub" font-size="10">tr</tspan>, validation days D<tspan baseline-shift="sub" font-size="10">va</tspan>  <tspan font-style="normal">(walk-forward, no shuffle)</tspan></text>
  <text x="98" y="107" font-size="15" font-style="italic">Params θ;  loss weights w<tspan baseline-shift="sub" font-size="10">r</tspan> = 1, w<tspan baseline-shift="sub" font-size="10">v</tspan> = 0.1;  patience P = 15;  E<tspan baseline-shift="sub" font-size="10">max</tspan> = 100</text>
  <text x="98" y="130" font-size="15" font-style="italic">Head: R<tspan baseline-shift="super" font-size="10">d′</tspan> → 64 → 1, ReLU, dropout 0.2</text>
  <text x="24" y="158" font-size="15" font-weight="bold">Output:</text>
  <text x="98" y="158" font-size="15" font-style="italic">θ* selected at best validation IC</text>
  <line x1="20" y1="174" x2="720" y2="174" stroke="#000" stroke-width="1"/>
  <text x="50" y="200" font-size="15" text-anchor="end">1:</text>
  <text x="60" y="200" font-size="15" font-style="italic">best ← −∞;  wait ← 0</text>
  <text x="50" y="224" font-size="15" text-anchor="end">2:</text>
  <text x="60" y="224" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for</tspan> epoch = 1 <tspan font-style="normal" font-weight="bold">to</tspan> E<tspan baseline-shift="sub" font-size="10">max</tspan> <tspan font-style="normal" font-weight="bold">do</tspan></text>
  <text x="50" y="248" font-size="15" text-anchor="end">3:</text>
  <text x="82" y="248" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for each</tspan> day-batch D<tspan baseline-shift="sub" font-size="10">b</tspan> ⊂ D<tspan baseline-shift="sub" font-size="10">tr</tspan>, in time order <tspan font-style="normal" font-weight="bold">do</tspan></text>
  <text x="520" y="248" font-size="13" fill="#1f4e8c">&#9655; 32 days per batch</text>
  <text x="50" y="272" font-size="15" text-anchor="end">4:</text>
  <text x="104" y="272" font-size="15" font-style="italic">ŷ(t) ← Head(Phase2(Phase1(t))),  for all t ∈ D<tspan baseline-shift="sub" font-size="10">b</tspan></text>
  <text x="50" y="296" font-size="15" text-anchor="end">5:</text>
  <text x="104" y="296" font-size="15" font-style="italic">L<tspan baseline-shift="sub" font-size="10">MSE</tspan> ← mean<tspan baseline-shift="sub" font-size="10">t,j</tspan> (ŷ<tspan baseline-shift="sub" font-size="10">j</tspan>(t) − y<tspan baseline-shift="sub" font-size="10">j</tspan>(t))²</text>
  <text x="50" y="320" font-size="15" text-anchor="end">6:</text>
  <text x="104" y="320" font-size="15" font-style="italic">L<tspan baseline-shift="sub" font-size="10">rank</tspan> ← mean over pairs y<tspan baseline-shift="sub" font-size="10">u</tspan>(t) &gt; y<tspan baseline-shift="sub" font-size="10">v</tspan>(t) of softplus(−(ŷ<tspan baseline-shift="sub" font-size="10">u</tspan>(t) − ŷ<tspan baseline-shift="sub" font-size="10">v</tspan>(t)))</text>
  <text x="520" y="320" font-size="13" fill="#1f4e8c">&#9655; RankNet</text>
  <text x="50" y="344" font-size="15" text-anchor="end">7:</text>
  <text x="104" y="344" font-size="15" font-style="italic">L<tspan baseline-shift="sub" font-size="10">var</tspan> ← mean<tspan baseline-shift="sub" font-size="10">t</tspan> (std<tspan baseline-shift="sub" font-size="10">j</tspan> ŷ<tspan baseline-shift="sub" font-size="10">j</tspan>(t) − std<tspan baseline-shift="sub" font-size="10">j</tspan> y<tspan baseline-shift="sub" font-size="10">j</tspan>(t))²</text>
  <text x="520" y="344" font-size="13" fill="#1f4e8c">&#9655; keeps the cross-sectional spread</text>
  <text x="50" y="368" font-size="15" text-anchor="end">8:</text>
  <text x="104" y="368" font-size="15" font-style="italic">L ← L<tspan baseline-shift="sub" font-size="10">MSE</tspan> + w<tspan baseline-shift="sub" font-size="10">r</tspan> · L<tspan baseline-shift="sub" font-size="10">rank</tspan> + w<tspan baseline-shift="sub" font-size="10">v</tspan> · L<tspan baseline-shift="sub" font-size="10">var</tspan></text>
  <text x="50" y="392" font-size="15" text-anchor="end">9:</text>
  <text x="104" y="392" font-size="15" font-style="italic">θ ← AdamW step on ∇<tspan baseline-shift="sub" font-size="10">θ</tspan> L</text>
  <text x="520" y="392" font-size="13" fill="#1f4e8c">&#9655; lr 10⁻³, weight decay 10⁻³, clip 1</text>
  <text x="50" y="416" font-size="15" text-anchor="end">10:</text>
  <text x="82" y="416" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="50" y="440" font-size="15" text-anchor="end">11:</text>
  <text x="82" y="440" font-size="15" font-style="italic">IC<tspan baseline-shift="sub" font-size="10">va</tspan> ← mean<tspan baseline-shift="sub" font-size="10">t∈D<tspan baseline-shift="sub" font-size="8">va</tspan></tspan> corr<tspan baseline-shift="sub" font-size="10">j</tspan>(ŷ<tspan baseline-shift="sub" font-size="10">j</tspan>(t), y<tspan baseline-shift="sub" font-size="10">j</tspan>(t))</text>
  <text x="50" y="464" font-size="15" text-anchor="end">12:</text>
  <text x="82" y="464" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">if</tspan> IC<tspan baseline-shift="sub" font-size="10">va</tspan> &gt; best <tspan font-style="normal" font-weight="bold">then</tspan> best ← IC<tspan baseline-shift="sub" font-size="10">va</tspan>;  θ* ← θ;  wait ← 0</text>
  <text x="50" y="488" font-size="15" text-anchor="end">13:</text>
  <text x="82" y="488" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">else</tspan> wait ← wait + 1</text>
  <text x="50" y="512" font-size="15" text-anchor="end">14:</text>
  <text x="82" y="512" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end if</tspan></text>
  <text x="50" y="536" font-size="15" text-anchor="end">15:</text>
  <text x="82" y="536" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">if</tspan> wait ≥ P <tspan font-style="normal" font-weight="bold">then break</tspan></text>
  <text x="520" y="536" font-size="13" fill="#1f4e8c">&#9655; early stop</text>
  <text x="50" y="560" font-size="15" text-anchor="end">16:</text>
  <text x="82" y="560" font-size="15" font-style="italic">update learning rate</text>
  <text x="520" y="560" font-size="13" fill="#1f4e8c">&#9655; cosine warm restarts, T<tspan baseline-shift="sub" font-size="10">0</tspan> = 10, ×2</text>
  <text x="50" y="584" font-size="15" text-anchor="end">17:</text>
  <text x="60" y="584" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="50" y="608" font-size="15" text-anchor="end">18:</text>
  <text x="60" y="608" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">return</tspan> θ*</text>
  <line x1="20" y1="624" x2="720" y2="624" stroke="#000" stroke-width="2"/>
</svg>
