<svg viewBox="0 0 770 517" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman','Nimbus Roman',Georgia,serif">
  <rect width="770" height="517" fill="#ffffff"/>
  <line x1="20" y1="18" x2="750" y2="18" stroke="#000" stroke-width="2"/>
  <text x="24" y="44" font-size="17" font-weight="bold">Algorithm 1</text>
  <text x="140" y="44" font-size="17">Phase 1 — Dual-market Encoding</text>
  <line x1="20" y1="56" x2="750" y2="56" stroke="#000" stroke-width="1"/>
  <text x="24" y="84" font-size="15" font-weight="bold">Input:</text>
  <text x="98" y="84" font-size="15" font-style="italic">US features X<tspan baseline-shift="sub" font-size="10">1</tspan> ∈ R<tspan baseline-shift="super" font-size="10">n₁×T×F</tspan>,  TW features X<tspan baseline-shift="sub" font-size="10">2</tspan> ∈ R<tspan baseline-shift="super" font-size="10">n₂×T×F</tspan>  <tspan font-style="normal">(T = 1, F = 1: log return)</tspan></text>
  <text x="98" y="107" font-size="15" font-style="italic">US graph A<tspan baseline-shift="sub" font-size="10">1</tspan>(t) = (E<tspan baseline-shift="sub" font-size="10">1</tspan>, ω<tspan baseline-shift="sub" font-size="10">1</tspan>):  |ρ<tspan baseline-shift="sub" font-size="10">ik</tspan>| &gt; τ over the T<tspan baseline-shift="sub" font-size="10">ρ</tspan> days up to t − 1</text>
  <text x="98" y="130" font-size="15" font-style="italic">TW same-industry neighbours N(j), fixed  <tspan font-style="normal">(2018Q4 industry labels)</tspan></text>
  <text x="98" y="153" font-size="15" font-style="italic">Shared LSTM;  GATv2 encoder GAT<tspan baseline-shift="sub" font-size="10">1</tspan>;  relational weights W<tspan baseline-shift="sub" font-size="10">0</tspan>, W<tspan baseline-shift="sub" font-size="10">s</tspan>, b;  projections P<tspan baseline-shift="sub" font-size="10">1</tspan>, P<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <text x="24" y="181" font-size="15" font-weight="bold">Output:</text>
  <text x="98" y="181" font-size="15" font-style="italic">Latent states h<tspan baseline-shift="sub" font-size="10">1</tspan> ∈ R<tspan baseline-shift="super" font-size="10">n₁×d′</tspan>,  h<tspan baseline-shift="sub" font-size="10">2</tspan> ∈ R<tspan baseline-shift="super" font-size="10">n₂×d′</tspan>,  d′ = 32</text>
  <line x1="20" y1="197" x2="750" y2="197" stroke="#000" stroke-width="1"/>
  <text x="50" y="223" font-size="15" text-anchor="end">1:</text>
  <text x="60" y="223" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for</tspan> ℓ = 1 <tspan font-style="normal" font-weight="bold">to</tspan> 2 <tspan font-style="normal" font-weight="bold">do</tspan> X<tspan baseline-shift="sub" font-size="10">ℓ</tspan> ← BN<tspan baseline-shift="sub" font-size="10">F</tspan>(X<tspan baseline-shift="sub" font-size="10">ℓ</tspan>) <tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="500" y="223" font-size="13" fill="#1f4e8c">&#9655; feature-wise norm, shared statistics</text>
  <text x="50" y="247" font-size="15" text-anchor="end">2:</text>
  <text x="60" y="247" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for</tspan> ℓ = 1 <tspan font-style="normal" font-weight="bold">to</tspan> 2 <tspan font-style="normal" font-weight="bold">do</tspan></text>
  <text x="50" y="271" font-size="15" text-anchor="end">3:</text>
  <text x="82" y="271" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for each</tspan> node i in layer ℓ <tspan font-style="normal" font-weight="bold">do</tspan></text>
  <text x="50" y="295" font-size="15" text-anchor="end">4:</text>
  <text x="104" y="295" font-size="15" font-style="italic">s<tspan baseline-shift="sub" font-size="10">ℓ,i</tspan> ← LSTM(X<tspan baseline-shift="sub" font-size="10">ℓ,i</tspan>)[T]</text>
  <text x="500" y="295" font-size="13" fill="#1f4e8c">&#9655; one LSTM for both markets</text>
  <text x="50" y="319" font-size="15" text-anchor="end">5:</text>
  <text x="82" y="319" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="50" y="343" font-size="15" text-anchor="end">6:</text>
  <text x="60" y="343" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="50" y="367" font-size="15" text-anchor="end">7:</text>
  <text x="60" y="367" font-size="15" font-style="italic">z<tspan baseline-shift="sub" font-size="10">1</tspan> ← GAT<tspan baseline-shift="sub" font-size="10">1</tspan>(s<tspan baseline-shift="sub" font-size="10">1</tspan>, E<tspan baseline-shift="sub" font-size="10">1</tspan>, ω<tspan baseline-shift="sub" font-size="10">1</tspan>)</text>
  <text x="500" y="367" font-size="13" fill="#1f4e8c">&#9655; US: correlation graph</text>
  <text x="50" y="391" font-size="15" text-anchor="end">8:</text>
  <text x="60" y="391" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">for each</tspan> TW node j = 1 <tspan font-style="normal" font-weight="bold">to</tspan> n<tspan baseline-shift="sub" font-size="10">2</tspan> <tspan font-style="normal" font-weight="bold">do</tspan></text>
  <text x="50" y="415" font-size="15" text-anchor="end">9:</text>
  <text x="82" y="415" font-size="15" font-style="italic">z<tspan baseline-shift="sub" font-size="10">2j</tspan> ← W<tspan baseline-shift="sub" font-size="10">0</tspan> s<tspan baseline-shift="sub" font-size="10">2j</tspan> + (1 / |N(j)|) Σ<tspan baseline-shift="sub" font-size="10">k∈N(j)</tspan> W<tspan baseline-shift="sub" font-size="10">s</tspan> s<tspan baseline-shift="sub" font-size="10">2k</tspan> + b</text>
  <text x="500" y="415" font-size="13" fill="#1f4e8c">&#9655; TW: self + same-industry mean (R-GCN)</text>
  <text x="50" y="439" font-size="15" text-anchor="end">10:</text>
  <text x="60" y="439" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">end for</tspan></text>
  <text x="50" y="463" font-size="15" text-anchor="end">11:</text>
  <text x="60" y="463" font-size="15" font-style="italic">h<tspan baseline-shift="sub" font-size="10">1</tspan> ← LayerNorm(GELU(P<tspan baseline-shift="sub" font-size="10">1</tspan> · z<tspan baseline-shift="sub" font-size="10">1</tspan>));   h<tspan baseline-shift="sub" font-size="10">2</tspan> ← LayerNorm(GELU(P<tspan baseline-shift="sub" font-size="10">2</tspan> · z<tspan baseline-shift="sub" font-size="10">2</tspan>))</text>
  <text x="500" y="463" font-size="13" fill="#1f4e8c">&#9655; type-specific projection</text>
  <text x="50" y="487" font-size="15" text-anchor="end">12:</text>
  <text x="60" y="487" font-size="15" font-style="italic"><tspan font-style="normal" font-weight="bold">return</tspan> h<tspan baseline-shift="sub" font-size="10">1</tspan>, h<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <line x1="20" y1="503" x2="750" y2="503" stroke="#000" stroke-width="2"/>
</svg>
