<line x1="885.1" y1="250" x2="885.1" y2="500" stroke="#e4e7eb" stroke-width="1.5"/>
<text x="885.1" y="530.0" font-size="20" text-anchor="middle" fill="#5b6672" font-weight="normal" font-style="normal">2024</text>
