<text x="56" y="56" font-size="27" font-weight="600" fill="#1a1a1a">30 檔美股的表示 h₁ᵢ 如何一路被壓成同一個向量，以及它的後果</text>
<text x="56" y="88" font-size="16" fill="#8a8a8a">一根箭頭 = 一檔美股，共 30 根。扇形張角按實測兩兩餘弦換算，非示意。四站維度不同（9 / 64 / 64 / 32），但餘弦量的是「這 30 個向量彼此多對齊」，跨站可比。數字為已訓練的舊寫法 arm。</text>
