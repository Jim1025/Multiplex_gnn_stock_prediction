data:
  start_date: 2019-01-01
  end_date: 2025-12-31
  snapshot_dir: data/graphs/snapshots
  features_dir: data/features
  universe: k7          # k7 | tw50。必須與 snapshot_dir 用同一個 universe 建
                        # （Dataset 建構時會檢查節點數，不符直接拋錯）。
                        # 換 tw50 時 snapshot_dir 也要一起換。
  split:
    train_end: 1150   # indices 0–1149  (70%)
    val_end:   1397   # indices 1150–1396 (15%)
    # test:    indices 1397–1642         (15%)

model:
  architecture: magnet  # magnet | baseline_lstm | baseline_tw_gnn | magnet_no_a12（M6 Stage 0 ablation）
                        # baseline_early_fusion（輸入層拼接 ADR 特徵的對照組）
  lstm:
    input_dim: 9          # F = 9 維技術指標特徵
    hidden_dim: 64
    num_layers: 1
    T_history: 20         # 回看 20 個交易日
    bidirectional: false  # 預測任務不看未來
    dropout: 0.1
    input_norm: none      # none（預設，維持既有 run）| batchnorm
    input_norm_scope: shared   # shared（預設，兩層共用一個 FeatureNorm）| per_layer
                          # SharedLSTM 在 MAGNET 裡被呼叫兩次（L1 30 檔 / L2 50 檔），
                          # shared 下兩次共用 running stats 與 affine 參數；實測合併
                          # 統計量無法讓兩市場各自回到 std 1（US log_return 1.4304 /
                          # TW 0.9350，殘餘 1.53 倍）。per_layer 每層各一個。
                          # batchnorm = 逐特徵跨節點對齊尺度，放在 LSTM 之前。
                          # 動機：資料層不做正規化，LSTM 吃到的 RSI_14 (std 11.5)
                          # 比 log_return (std 0.0245) 大 471 倍，初始化時 4 成閘門
                          # 已飽和，且 weight_decay 1e-3 > log_return 方向的資料
                          # 曲率 4.97e-4，主幹最後等於只看 RSI。詳見 encoders.py。
  gat:
    hidden_dim: 64
    num_layers: 2
    num_heads: 4
    dropout: 0.1
    use_edge_attr: true   # 邊權 |ρ| 餵入 attention
    concat: true          # heads 用 concat（最後一層改 average）
  projection:
    d_prime: 32           # 共同潛在維度
    activation: gelu
    layer_norm: true
  fusion:
    attention_hidden: 64
    gate_activation: sigmoid
  prediction_head:
    hidden_dim: 64
    dropout: 0.2

loss_weights:
  mse: 1.0
  rank: 0.5             # M4.5 Phase 1: 0.1 → 0.5（強迫學排序）
  align: 0.0            # M4.5 Phase 1: 0.1 → 0.0（關掉反向學的 align loss）
  variance: 0.1         # M4.5 Phase 2: 新增，對抗 prediction collapse（std(ŷ)→std(y)）

align_loss:
  enabled: false        # M4.5 Phase 1: 同步停用
  temperature: 0.1

training:
  seed: 42
  max_epochs: 100
  patience: 15           # M4.5 Phase 1: 10 → 15（給更多耐心觀察收斂）
  batch_size: 32
  lr: 0.001              # M4.5 Phase 2: 3e-3 → 1e-3（Phase 1 觀察到 3e-3 後期會崩盤）
  optimizer: adam        # adam（預設，維持既有 run）| adamw
                         # torch.optim.Adam 的 weight_decay 是 L2-in-gradient，
                         # 會被 Adam 的分母除過；對真實梯度接近零的參數等於一個
                         # 固定大小往零推的步伐。adamw 用解耦衰減，可分離
                         # 「正規化不足」與「衰減耦合」兩個機制。
  weight_decay: 0.001    # M4.5 Phase 1: 0.0001 → 0.001（10× regularization）
  device: auto           # auto | cpu | mps | cuda
  # 評估專用 device。預設 cpu，且不要改成 auto/mps。
  #
  # 為什麼：GATv2Conv 的鄰居聚合走 scatter-add，MPS 後端的浮點加總順序在
  # run 之間不固定。同一份 best.pt 在 MPS 上連評 5 次，test IC 落在
  # +0.0298 .. +0.0466（全距 0.0169，與跨 seed 的 sd 0.0174 同量級）；
  # 同樣 5 次在 CPU 上是位元相同的 +0.058480。
  # 也就是說 MPS 記下來的 metric 是一次抽樣，連它自己都重現不了——
  # 2026-08-16 之前所有 run 的 meta.json / predictions CSV 都受此影響。
  #
  # 訓練仍走 training.device（MPS 快很多）；只有 evaluate() 換到這個
  # device，全 246 天一次 1.3 秒，成本可忽略。
  eval_device: cpu       # cpu（可重現）| auto | mps | cuda
  num_workers: 0         # MPS 上建議 0（multiprocessing 不穩）
  pin_memory: false
  grad_clip: 1.0         # 梯度裁剪上限
  log_every_n_steps: 10  # console print 頻率
  min_delta: 0.0         # IC 改善判定下限
  early_stop_metric: IC  # 監控 val 上的 IC（越大越好）

evaluation:
  portfolio:
    n_side: 2              # 多空各取 n_side 檔；需 2*n_side <= k（k=7 時上限 3）
    periods_per_year: 252  # Sharpe 年化因子
    # 無交易成本、無流動性限制 → 屬 pre-cost 診斷，不是可實作 alpha

mlflow:
  experiment_name: MAGNET_M4_baseline
  tracking_uri: file:./mlruns
  log_artifacts: true
