# tw50_imed_wl0.yaml — 2x2 消融的第四格：融合提前 + 跨層邊可學
#
# 為什麼需要這一格：
#   融合位置（圖之前 / 圖之後）與跨層邊（凍結 / 可學）是兩個獨立因子。
#   已測三格，缺對角：
#
#                       跨層邊凍結 λ=1e-3      跨層邊可學 λ=0
#     融合在圖之後        +0.006（tw50 MAGNET）  +0.012（tw50chk_wl0_*）
#     融合在圖之前        +0.004（tw50chk_imed_*）本檔
#
#   已測的兩個單因子方向相反：只把融合提前 +0.006 → +0.004（變差），
#   只解鎖可學邊 +0.006 → +0.012（變好）。缺這一格就無法分離主效果
#   與交互作用，也無法回答「兩者一起做會怎樣」。
#
# tw50chk_imed_* 那三個 run 的 config 沒有 weak_links 區塊，建構出來
# weak_mode = None——只有 7 條恆等邊，候選邊根本沒有被建立。那組實驗
# 測的是「融合提前 + 固定邊」，不是「融合提前 + 可學邊」。
#
# 用法：
#   python -m src.train.train --config configs/tw50_imed_wl0.yaml \
#       --tag tw50_imedwl0_s42 --seed 42
#
# 與 configs/tw50.yaml 的差異僅限以下三處，其餘必須逐字相同
# （由 tests/test_configs.py 守護）：
#
#   1. model.architecture           magnet → magnet_intermediate
#   2. model.weak_links             新增 {mode: free, lambda_sparse: 0.0}
#   3. mlflow.experiment_name       （只影響 MLflow 分組，不影響數值）
#
# 第 2 點的 lambda_sparse 必須是 0.0，不是「縮放後的小值」：對照組
# tw50chk_wl0_* 用的就是 0.0，兩格要比較融合位置就不能同時動 λ。
# λ 隨 |M| 縮放是另一個實驗（p22 第 4 點），不在這一格裡混進來。
#
# mode 必須在此明寫。build_model 只對 magnet_weak_free / magnet_weak_industry
# 注入 mode，magnet_intermediate 走的是直接建構的分支，讀的是 cfg 原值。

data:
  start_date: 2019-01-01
  end_date: 2025-12-30   # 見 tw50.yaml 檔頭第 3 點；不可改回 12-31
  snapshot_dir: data/graphs/snapshots_tw50
  features_dir: data/features
  universe: tw50         # 必須與 snapshot_dir 用同一個 universe 建
                         # （Dataset 建構時會檢查節點數，不符直接拋錯）
  split:
    train_end: 1150   # indices 0–1149  (70%)  2019-04-11 ~ 2023-12-19
    val_end:   1397   # indices 1150–1396 (15%) 2023-12-20 ~ 2024-12-25
    # test:    indices 1397–1642         (15%) 2024-12-26 ~ 2025-12-30

model:
  architecture: magnet_intermediate  # 融合移到 L2 圖傳播之前，見 magnet_intermediate.py
  lstm:
    input_dim: 9          # F = 9 維技術指標特徵
    hidden_dim: 64
    num_layers: 1
    T_history: 20         # 回看 20 個交易日
    bidirectional: false  # 預測任務不看未來
    dropout: 0.1
    input_norm: none      # none（預設）| batchnorm，見 base.yaml 的完整說明
    input_norm_scope: shared   # shared（預設）| per_layer，見 base.yaml
  gat:
    hidden_dim: 64
    num_layers: 2
    num_heads: 4
    dropout: 0.1
    use_edge_attr: true   # 邊權 |ρ| 餵入 attention
    graph_ablate: none    # 見 base.yaml 的完整說明
    graph_ablate_seed: 42
    concat: true          # heads 用 concat（最後一層改 average）
  projection:
    d_prime: 32           # 共同潛在維度
    activation: gelu
    layer_norm: true
  fusion:
    attention_hidden: 64
    gate_activation: sigmoid
  prediction_head:
    hidden_dim: 64
    dropout: 0.2
    per_target: false     # false（預設，全體共用讀出）| true（每檔台股一條
                          # 讀出向量）。缺口見 proposal §34.2 缺陷 2
  weak_links:
    mode: free            # 1,493 條候選邊（30x50 扣掉 7 條恆等邊）
    lambda_sparse: 0.0    # 見檔頭第 2 點；與 tw50chk_wl0_* 一致
    beta_layer: false     # 階段 P1，見 base.yaml 的完整說明
    beta_n_factors: 1     # 1（預設，等權市場因子）| k>1（k 個學出來的
                          # 因子方向）。依據見 §21 的低秩分解
    beta_init_std: 0.3
    beta_alpha_mean: 1.0
    beta_gamma_mean: 0.0
    beta_b_init_std: 0.0
    beta_use_identity: true
    beta_use_factor: true
    beta_use_residual: true

loss_weights:
  mse: 1.0
  rank: 0.5             # M4.5 Phase 1: 0.1 → 0.5（強迫學排序）
  align: 0.0            # M4.5 Phase 1: 0.1 → 0.0（關掉反向學的 align loss）
  variance: 0.1         # M4.5 Phase 2: 新增，對抗 prediction collapse（std(ŷ)→std(y)）

align_loss:
  enabled: false        # 不對稱 universe 下必須維持 false：align loss 的正樣本
                        # 定義是「第 i 列是同一家公司」，n1 != n2 時對角線不再
                        # 是正樣本集合。啟用會在 CombinedLoss 直接拋錯。
  temperature: 0.1

training:
  seed: 42
  max_epochs: 100
  patience: 15           # M4.5 Phase 1: 10 → 15（給更多耐心觀察收斂）
  batch_size: 32
  lr: 0.001              # M4.5 Phase 2: 3e-3 → 1e-3（Phase 1 觀察到 3e-3 後期會崩盤）
  optimizer: adam        # adam（預設）| adamw，見 base.yaml 的完整說明
  weight_decay: 0.001    # M4.5 Phase 1: 0.0001 → 0.001（10× regularization）
  device: auto           # auto | cpu | mps | cuda
  # 記錄用的評估一律走 cpu：MPS 的 scatter-add 聚合順序 run 間不固定，
  # 同一份 best.pt 連評 5 次 test IC 全距 0.0169（CPU 為位元相同）。
  # 訓練仍走上面的 device。詳見 configs/base.yaml 的完整說明。
  eval_device: cpu       # cpu（可重現）| auto | mps | cuda
  num_workers: 0         # MPS 上建議 0（multiprocessing 不穩）
  pin_memory: false
  grad_clip: 1.0         # 梯度裁剪上限
  log_every_n_steps: 10  # console print 頻率
  min_delta: 0.0         # IC 改善判定下限
  early_stop_metric: IC  # 監控 val 上的 IC（越大越好）

evaluation:
  portfolio:
    n_side: 5              # 多空各取 5 檔 = 50 檔的十分位，橫截面研究的慣例。
                           # k=7 時用 2（上限 3），比例上是各 29%；在 50 檔沿用 2
                           # 會變成各 4%，是極端集中的組合，Sharpe 由少數個股主導。
                           # 兩個 universe 的 Sharpe 本來就不可直接比較（成分不同），
                           # 故此處選慣例值而非等比例（等比例會是各 14 檔）。
                           # E9 的主要指標是 IC，組合指標為輔。
    periods_per_year: 252  # Sharpe 年化因子
    # 無交易成本、無流動性限制 → 屬 pre-cost 診斷，不是可實作 alpha

mlflow:
  experiment_name: MAGNET_E9_imed_wl0
  tracking_uri: file:./mlruns
  log_artifacts: true
